name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck + test (LocalAdapter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Stable LocalAdapter suite (the default path MemorySystem ships).
      # SqliteAdapter WIP tests are intentionally excluded here and run
      # separately via `pnpm run test:sqlite` (expected-red until parity).
      - name: Test
        run: pnpm test
